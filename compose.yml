name: repoguard
x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  environment: &backend-env
    REPOGUARD_ENVIRONMENT: local
    REPOGUARD_FIXTURE_MODE: 'true'
    REPOGUARD_DATABASE_URL: postgresql+psycopg://repoguard:${REPOGUARD_LOCAL_DB_PASSWORD:?Run scripts/local_env.py first}@postgres:5432/repoguard?connect_timeout=5
    REPOGUARD_REDIS_URL: redis://redis:6379/0
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:size=256m,mode=1777]
  mem_limit: 1g
  cpus: 1.0
  pids_limit: 128
  networks: [data, egress]
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    user: postgres
    environment:
      POSTGRES_USER: repoguard
      POSTGRES_DB: repoguard
      POSTGRES_PASSWORD: ${REPOGUARD_LOCAL_DB_PASSWORD:?Run scripts/local_env.py first}
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    tmpfs: [/tmp:mode=1777, /var/run/postgresql:uid=70,gid=70,mode=0770]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    networks: [data]
    healthcheck:
      test: [CMD, pg_isready, -U, repoguard, -d, repoguard]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    user: redis
    command: [redis-server, --appendonly, 'yes', --save, '60', '1']
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis-data:/data]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *backend
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *backend
    command: [python, -m, repoguard.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: on-failure:3
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      REPOGUARD_API_URL: http://api:8000
    ports: ['127.0.0.1:3000:3000']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:mode=1777]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    networks: [egress]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
networks:
  data: {internal: true}
  egress: {}
volumes:
  postgres-data: {}
  redis-data: {}
