# Definition prepared locally; hosted CI has not been run or contacted.
name: RepoGuard quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: repoguard_test
          POSTGRES_DB: repoguard_test
          POSTGRES_PASSWORD: disposable-ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U repoguard_test -d repoguard_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      REPOGUARD_TEST_POSTGRES_URL: postgresql+psycopg://repoguard_test:disposable-ci-test-only@127.0.0.1:5432/repoguard_test?connect_timeout=5
      REPOGUARD_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.11.26'
      - run: uv sync --frozen --python 3.12
      - run: uv sync --directory analysis --frozen --python 3.12
      - run: uv run python scripts/verify.py --scope backend
      - run: uv run python scripts/verify.py --scope services
      - run: uv run python scripts/verify.py --scope semgrep
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.11.26'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.15.0'
      - run: uv sync --frozen --python 3.12
      - run: uv sync --directory analysis --frozen --python 3.12
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: uv run python scripts/verify.py --scope frontend
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.11.26'
      - run: uv sync --frozen --python 3.12
      - run: docker build -f sandbox/Dockerfile -t repoguard-validator:ci .
      - name: Verify real isolation with an immutable local image identity
        run: |
          export REPOGUARD_TEST_VALIDATOR_IMAGE="$(docker image inspect repoguard-validator:ci --format '{{.Id}}')"
          uv run python scripts/verify.py --scope sandbox
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.11.26'
      - run: uv sync --frozen --python 3.12
      - run: uv run python scripts/local_env.py
      - run: docker compose --env-file .env.compose config --quiet
      - run: docker compose --env-file .env.compose build
      - run: docker compose --env-file .env.compose up --wait --wait-timeout 120
      - run: docker compose -f compose.verify.yml up --build --abort-on-container-exit --exit-code-from checks
      - if: always()
        run: docker compose -f compose.verify.yml down
      - if: always()
        run: docker compose --env-file .env.compose down
